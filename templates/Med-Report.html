<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Healthcare System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='med.css') }}">
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>MedInfo</h1>
            <div class="header-bottom" style="width:100%; display:flex; justify-content:center; align-items:center; gap:1.5rem; margin-top:0.5rem;">
                <a href="{{ url_for('dashboard') }}" class="dashboard-link">← Back to Dashboard</a>
                <div class="theme-toggler">
                    <span class="active">🌞</span>
                    <span>🌙</span>
                </div>
            </div>
        </div>

        <!-- Motion Text Section -->
        <div class="motion-text-section">
            <div class="motion-bg">
                <span class="motion-icon">💊</span>
                <span class="motion-icon">🩺</span>
                <span class="motion-icon">🍏</span>
                <span class="motion-text" id="motionText">What do you want to know about a drug?</span>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-bar-container">
            <form id="drugSearchForm">
                <input type="text" id="drugSearchInput" placeholder="Search for a drug..." autocomplete="off" required>
                <button type="submit">Search</button>
            </form>
        </div>

        <div id="drugInfoCardContainer"></div>

        <!-- Rotating Health Advice Cards -->
        <div class="advice-cards-container" id="adviceCardsContainer"></div>
    </div>

    <div class="notification-container" id="notificationContainer"></div>

    <script src="{{ url_for('static', filename='med.js') }}"></script>
</body>
</html>
