<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedTrack Pro - Medication Reminder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='notify.css') }}">
    <style>
        .sound-controls, .form-group {
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .sound-test-btn, #sound-mute-btn {
            margin-left: 8px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background 0.2s;
        }
        .sound-test-btn:hover, #sound-mute-btn:hover {
            background: #217dbb;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-pills"></i> Dr.On Call</h1>
            <p>Professional Medication Management System</p>
        </header>

        <div class="main-content">
            <div class="form-section">
                <h2>Add New Reminder</h2>
                <form id="reminder-form">
                    <div class="form-group">
                        <label for="patient-name">Patient Name:</label>
                        <input type="text" id="patient-name" required>
                    </div>
                    <div class="form-group">
                        <label for="medication">Medication:</label>
                        <input type="text" id="medication" required>
                    </div>
                    <div class="form-group">
                        <label for="dosage">Dosage:</label>
                        <input type="text" id="dosage" required>
                    </div>
                    <div class="form-group">
                        <label for="reminder-time">Time:</label>
                        <input type="time" id="reminder-time" required>
                    </div>
                    <div class="form-group">
                        <label for="interval">Repeat Interval:</label>
                        <select id="interval" required>
                            <option value="none">No Repeat</option>
                            <option value="hours">Every X Hours</option>
                            <option value="days">Specific Days</option>
                            <option value="custom">Custom Date & Time</option>
                        </select>
                    </div>
                    <div class="form-group" id="hours-interval-group" style="display:none;">
                        <label for="hours-interval">Hours Interval:</label>
                        <input type="number" id="hours-interval" min="1" value="1">
                    </div>
                    <div class="form-group" id="days-of-week-group" style="display:none;">
                        <label>Days of Week:</label><br>
                        <label><input type="checkbox" name="days" value="monday"> Monday</label>
                        <label><input type="checkbox" name="days" value="tuesday"> Tuesday</label>
                        <label><input type="checkbox" name="days" value="wednesday"> Wednesday</label>
                        <label><input type="checkbox" name="days" value="thursday"> Thursday</label>
                        <label><input type="checkbox" name="days" value="friday"> Friday</label>
                        <label><input type="checkbox" name="days" value="saturday"> Saturday</label>
                        <label><input type="checkbox" name="days" value="sunday"> Sunday</label>
                    </div>
                    <div class="form-group" id="custom-interval-group" style="display:none;">
                        <label for="custom-date">Custom Date:</label>
                        <input type="date" id="custom-date">
                        <label for="custom-time">Custom Time:</label>
                        <input type="time" id="custom-time">
                    </div>
                    <div class="form-group">
                        <label for="sound-select">Notification Sound:</label>
                        <select id="sound-select" class="sound-select">
                            <option value="beep">Default Beep</option>
                            <option value="chime">Gentle Chime</option>
                            <option value="alarm">Alarm Tone</option>
                            <option value="none">No Sound</option>
                        </select>
                        <button type="button" id="sound-test-btn" class="btn btn-small">
                            <i class="fas fa-volume-up"></i> Test Sound
                        </button>
                        <button type="button" id="sound-mute-btn" class="btn btn-small">
                            <i class="fas fa-volume-mute"></i> Mute
                        </button>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Reminder</button>
                </form>
            </div>

            <div class="reminders-section">
                <h2>Active Reminders</h2>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search reminders...">
                </div>
                <div id="reminders-list" class="reminders-list">
                    <!-- Reminders will be rendered here, each with a Delete button -->
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Modal -->
    <div id="notification-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2><i class="fas fa-bell"></i> Medication Reminder</h2>
            <div id="notification-content"></div>
            <div class="sound-controls">
                <button id="sound-test-btn" class="btn btn-small">
                    <i class="fas fa-volume-up"></i> Test Sound
                </button>
                <button id="sound-mute-btn" class="btn btn-small">
                    <i class="fas fa-volume-mute"></i> Mute
                </button>
            </div>
            <div class="modal-actions">
                <button id="snooze-btn" class="btn btn-secondary">Snooze for 5 minutes</button>
                <button id="dismiss-btn" class="btn btn-primary">Dismiss</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='notify.js') }}"></script>
</body>
</html>
